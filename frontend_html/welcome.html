<!DOCTYPE html>
<html>
	<head>
		<title>Cover Page</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-independent-computer-modern/cmun-serif.css">
	</head>
	<body>		
		<div style="background: 
			linear-gradient(135deg, transparent 10%, rgba(219, 160, 188, 0.12) 25%, transparent 40%),
			linear-gradient(135deg, transparent 35%, rgba(219, 160, 188, 0.06) 50%, transparent 65%),
			linear-gradient(135deg, transparent 60%, rgba(219, 160, 188, 0.10) 75%, transparent 90%),
			#0d1117; 
			
width: 100%; min-height: 80vh; display: flex; align-items: center; justify-content: center; font-family: 'CMU Serif', 'Computer Modern Serif', Georgia, serif; box-sizing: border-box; padding: 24px 0;">
			<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 600px; text-align: center; box-sizing: border-box;">
				<div style="margin-bottom: 24px;">
					<p style="color: #DBA0BC; font-size: 1.1em; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; margin-top: 0; font-weight: bold;"> K-Hospital · Chennai </p>
					<h1 style="color: #ffffff; font-size: 2.6em; font-weight: 500; margin-bottom: 12px; margin-top: 0;"> Hospital Analytics Platform </h1>
				</div> 
				<table style="margin: 0 auto; border-collapse: collapse; background-color: rgba(22, 27, 34, 0.8); border-radius: 6px; overflow: hidden; border: 1px solid rgba(219, 160, 188, 0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
					<thead>
						<tr style="background-color: rgba(219, 160, 188, 0.08); color: #ffffff; text-transform: uppercase; font-size: 1em; letter-spacing: 1px; border-bottom: 1px solid rgba(219, 160, 188, 0.15);">
							<th style="padding: 16px 24px; font-weight: 600;">Branches</th>
							<th style="padding: 16px 24px; font-weight: 600;">Departments</th>
							<th style="padding: 16px 24px; font-weight: 600;">Total Revenue</th>
						</tr> 
					</thead>
					<tbody>
						<tr style="color: #ffffff; text-transform: uppercase; font-size: 3.5em; letter-spacing: 1px;">
							<th style="padding: 12px 24px; font-weight: normal;">3</th>
							<th style="padding: 12px 24px; font-weight: normal;">8</th>
							<th style="padding: 12px 24px; font-weight: normal; font-size: 0.65em;">₹50+ lakhs</th>			
						</tr> 
					</tbody>
				</table>
			</div> 
		</div> 
	</body>
</html>
